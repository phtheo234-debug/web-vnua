<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tạ Phương Thảo</title>
  </head>
  <body>
    <form>
      <label for="text-area">Textarea</label>
      <br />
      <input type="text" id="text-area" name="textarea" maxlength="140" />
      <p id="dem-text">Max 0/140</p>
      <br />
      <label for="input-field">Input Field</label>
      <br />
      <input type="text" id="input-field" name="inputfield" maxlength="20" />
      <p id="dem-input">Max 0/20</p>
    </form>
    <!-- count -->
    <script>
      const oTextarea = document.querySelector("#text-area");
      const oInputField = document.querySelector("#input-field");
      const demKyTuTextarea = document.querySelector("#dem-text");
      const demKyTuInputField = document.querySelector("#dem-input");
      oTextarea.addEventListener("input", () => {
        demKyTuTextarea.textContent = "Max " + oTextarea.value.length + "/140";
      });
      oInputField.addEventListener("input", () => {
        demKyTuInputField.textContent = "Max " + oInputField.value.length + "/20";
      });
    </script>
  </body>
</html>

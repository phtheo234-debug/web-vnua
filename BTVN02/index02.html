<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạ Phương Thảo</title>

    <style>
      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        line-height: 1.6;
      }

      .demo-box {
        border: 1px solid #ddd;
        padding: 12px;
      }

      .demo-box input {
        padding: 6px 8px;
        width: 200px;
        max-width: 100%;
      }

      #ds {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
      }

      #ds li {
        border-bottom: 1px solid #eee;
        padding: 8px 0;
      }

      #ds span {
        cursor: pointer;
      }

      #ds .da-mua {
        text-decoration: line-through;
        color: gray;
      }
    </style>
  </head>
  <body>
    <h1>Danh sách đi chợ</h1>

    <div class="demo-box">
      <form id="form">
        <label for="o-ten">Tên món</label>
        <input type="text" id="o-ten" placeholder="VD: pizza" required />
        <button type="submit">Thêm món</button>
      </form>
      <p id="thong-ke">Còn 0/0 món chưa mua</p>
      <ul id="ds"></ul>
    </div>

    <script>
      const form = document.querySelector("#form");
      const oTen = document.querySelector("#o-ten");
      const ds = document.querySelector("#ds");
      const thongKe = document.querySelector("#thong-ke");

      // Lấy danh sách đã lưu
      let danhSach = JSON.parse(localStorage.getItem("danhSachDiCho") || "[]");

      // Hiển thị danh sách và thống kê
      function hienThi() {
        ds.innerHTML = "";

        danhSach.forEach((mon, index) => {
          const li = document.createElement("li");
          const span = document.createElement("span");

          span.textContent = mon.ten;

          if (mon.daMua) {
            span.classList.add("da-mua");
          }

          // Bấm một lần: đổi trạng thái đã mua
          span.addEventListener("click", () => {
            danhSach[index].daMua = !danhSach[index].daMua;
            luuDanhSach();
            hienThi();
          });

          // Nháy đúp: xóa món
          span.addEventListener("dblclick", () => {
            danhSach.splice(index, 1);
            luuDanhSach();
            hienThi();
          });

          li.append(span);
          ds.append(li);
        });

        const chuaMua = danhSach.filter((mon) => !mon.daMua).length;

        thongKe.textContent = "Còn " + chuaMua + "/" + danhSach.length + " món chưa mua";
      }

      // Lưu danh sách vào localStorage
      function luuDanhSach() {
        localStorage.setItem("danhSachDiCho", JSON.stringify(danhSach));
      }

      // Thêm món
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const ten = oTen.value.trim();

        if (ten === "") return;

        danhSach.push({
          ten: ten,
          daMua: false,
        });

        luuDanhSach();
        hienThi();

        oTen.value = "";
        oTen.focus();
      });

      // Hiển thị dữ liệu khi mở trang
      hienThi();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạ Phương Thảo</title>
    <style>
      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        line-height: 1.6;
      }

      .demo-box {
        border: 1px solid #ddd;
        padding: 12px;
      }

      .demo-box input {
        padding: 6px 8px;
        width: 200px;
        max-width: 100%;
      }

      #ds {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
      }

      #ds li {
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: 1px solid #eee;
        padding: 8px 0;
      }

      #ds button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Danh sách đi chợ</h1>
    <div class="demo-box">
      <form id="form">
        <label for="o-ten">Tên món</label>
        <input type="text" name="" id="o-ten" placeholder="VD: pizza" required />
        <button type="submit">Thêm món</button>
      </form>
      <ul id="ds"></ul>
      <br />
      <h2>Chưa mua</h2>
      <ul id="ds-chua-mua"></ul>
    </div>
    <script>
      const form = document.querySelector("#form");
      const oTen = document.querySelector("#o-ten");
      const ds = document.querySelector("#ds");
      const dscmua = document.querySelector("#ds-chua-mua");

      form.addEventListener("submit", (e) => {
        e.preventDefault(); //không để trang tải lại
        const ten = oTen.value.trim();
        if (ten === "") return; //tên null bỏ qua

        //tao dong moi
        const li = document.createElement("li");

        //tạo danh sách chưa mua
        const chuaMua = document.createElement("li");
        chuaMua.textContent = ten;

        //đánh dấu đã mua, click 2 lần->xóa
        const daMua = document.createElement("span");
        daMua.textContent = ten;
        daMua.addEventListener("click", () => {
          if (daMua.innerHTML === ten) {
            daMua.innerHTML = "<del>" + ten + "</del>";
            chuaMua.remove();
          } else {
            daMua.textContent = ten;
            dscmua.append(chuaMua);
          }
        });
        daMua.addEventListener("dblclick", () => {
          li.remove();
          chuaMua.remove();
        });

        li.append(daMua);
        ds.append(li);
        dscmua.append(chuaMua);

        oTen.value = ""; //clear Input
        oTen.focus(); //Sẵn sàng gõ món tiếp theo
      });
    </script>
  </body>
</html>
